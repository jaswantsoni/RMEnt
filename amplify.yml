version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  buildImage:
    name: 'aws/codebuild/standard:7.0'
  computeType: BUILD_GENERAL1_LARGE
